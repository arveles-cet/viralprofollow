<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Giriş - Instagram Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 1.8em;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        .error {
            color: #e74c3c;
            text-align: center;
            margin-top: 10px;
            font-size: 0.9em;
        }
        
        .info {
            background: #e3f2fd;
            padding: 10px;
            border-radius: 5px;
            font-size: 0.85em;
            color: #1976d2;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🔐 Admin Paneli</h1>
        
        <form onsubmit="login(event)">
            <div class="form-group">
                <label>Kullanıcı Adı</label>
                <input type="text" id="username" required>
            </div>
            
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" id="password" required>
            </div>
            
            <button type="submit">Giriş Yap</button>
            
            <div id="error" class="error"></div>
        </form>
        
        <div class="info">
            <strong>Demo Hesabı:</strong><br>
            Kullanıcı: admin<br>
            Şifre: admin123
        </div>
    </div>
    
    <script>
        async function login(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                
                if (response.ok) {
                    window.location.href = '/';
                } else {
                    document.getElementById('error').textContent = '❌ Kullanıcı adı veya şifre yanlış';
                }
            } catch (error) {
                document.getElementById('error').textContent = '❌ Bağlantı hatası';
            }
        }
    </script>
</body>
</html>
